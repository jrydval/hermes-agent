name: Build Hermes Light for Apple Silicon

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: macOS arm64 Light
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: Check out Hermes
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Verify native Apple Silicon runner
        run: |
          set -euxo pipefail
          test "$(uname -m)" = "arm64"
          sw_vers
          python3 --version

      - name: Enable ad-hoc signing for Apple Silicon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/desktop/electron-builder.config.cjs')
          text = p.read_text()
          old = """    sign: createMacSigner({
                entitlements: path.join(__dirname, 'electron/entitlements.mac.plist'),
                entitlementsInherit: path.join(__dirname, 'electron/entitlements.mac.inherit.plist'),
                hardenedRuntime: true,
                ignore: (/** @type {string} */ file) => {
                  try {
                    if (fs.lstatSync(file).isDirectory()) {
                      return false
                    }
                    return !isMachO(file)
                  } catch {
                    return true
                  }
                }
              })"""
          new = """    sign: {
                identity: '-',
                entitlements: path.join(__dirname, 'electron/entitlements.mac.plist'),
                entitlementsInherit: path.join(__dirname, 'electron/entitlements.mac.inherit.plist'),
                hardenedRuntime: true,
                ignore: (/** @type {string} */ file) => {
                  try {
                    if (fs.lstatSync(file).isDirectory()) {
                      return false
                    }
                    return !isMachO(file)
                  } catch {
                    return true
                  }
                }
              }"""
          if old not in text:
              raise SystemExit('Expected macOS signing block not found')
          p.write_text(text.replace(old, new, 1))

          identity = Path('apps/desktop/product-identity.cjs')
          text = identity.read_text()
          old = "const buildCommit = /^[a-f0-9]{40}$/.test(buildCommitEnv) ? buildCommitEnv.slice(0, 7) : null"
          new = "const buildCommit = null // Clean product name for this private Light build"
          if old not in text:
              raise SystemExit('Expected commit display-name rule not found')
          identity.write_text(text.replace(old, new, 1))
          PY
          git config user.name "Hermes Light Builder"
          git config user.email "actions@users.noreply.github.com"
          git add apps/desktop/electron-builder.config.cjs apps/desktop/product-identity.cjs
          git commit -m "build: ad-hoc sign macOS Light artifact with clean name"

      - name: Build ad-hoc-signed remote-only Hermes Light
        run: scripts/build-bundle.sh --variant light

      - name: Verify application signature
        run: |
          set -euxo pipefail
          APP=$(find apps/desktop/release/mac-arm64 -maxdepth 1 -name 'Hermes Light.app' -print -quit)
          test -n "$APP"
          test "$(basename "$APP")" = "Hermes Light.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -E 'Signature=adhoc|TeamIdentifier=not set'

      - name: Record checksums and sizes
        run: |
          set -euxo pipefail
          cd apps/desktop/release
          shasum -a 256 ./*.dmg ./*.zip > SHA256SUMS.txt
          du -sh .
          ls -lah

      - name: Upload macOS installer
        uses: actions/upload-artifact@v5
        with:
          name: Hermes-Light-macOS-Apple-Silicon
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
